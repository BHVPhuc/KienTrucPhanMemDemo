apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: order-canary-routing
spec:
  hosts:
  - order-service
  http:
  - route:
    - destination:
        host: order-service
        subset: v1
      weight: 90 # 90% Lưu lượng chạy vào bản ổn định v1
    - destination:
        host: order-service
        subset: v2
      weight: 10 # 10% Lưu lượng chạy vào bản thử nghiệm Canary v2
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: order-service-subsets
spec:
  host: order-service
  trafficPolicy:
    # 1. Tự động mã hóa mTLS giữa các Sidecar Envoy
    tls:
      mode: ISTIO_MUTUAL
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
